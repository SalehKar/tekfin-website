[build]
  command = "npm run build"
  publish = "build"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/storage-advisor"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/storage-advisor"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
